name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      MPLBACKEND: Agg
      PYTHONNOUSERSITE: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set the external evidence directory
        run: echo "CI_REPORT_DIR=$RUNNER_TEMP/mdcorealign-ci" >> "$GITHUB_ENV"

      - name: Install explicit test and build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci-product.txt -r requirements-ci-quality.txt

      - name: Build temporary candidate and check metadata
        run: |
          python -m build
          python -m twine check dist/*
          echo "CI_WHEEL=$(realpath dist/mdcorealign-*.whl)" >> "$GITHUB_ENV"
          echo "CI_SDIST=$(realpath dist/mdcorealign-*.tar.gz)" >> "$GITHUB_ENV"
          echo "CI_EXPECTED_VERSION=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')" >> "$GITHUB_ENV"

      - name: Install the built wheel without a source overlay
        run: |
          python -m pip install "$CI_WHEEL"
          python -m pip check
          python -m pip freeze

      - name: Import and CLI smoke tests
        run: |
          python -c "import mdcorealign; print(mdcorealign.__version__)"
          mdcorealign --help
          mdcorealign align --help
          mdcorealign flexibility --help
          mdcorealign diagnostics --help
          mdcorealign audit-preprocessing --help
          mdcorealign local-deformation --help
          mdcorealign apply --help
          mdcorealign doctor

      - name: Run toy quickstart
        run: bash examples/toy_md/run_quickstart.sh "$RUNNER_TEMP/mdcorealign-toy-output"

      - name: Run product-mode examples
        run: |
          bash examples/exact_cpu/run.sh "$RUNNER_TEMP/mdcorealign-exact-output"
          bash examples/throughput_cpu/run.sh "$RUNNER_TEMP/mdcorealign-throughput-output"
          bash examples/local_deformation/run.sh "$RUNNER_TEMP/mdcorealign-local-output"
          bash examples/apply_transforms/run.sh "$RUNNER_TEMP/mdcorealign-apply-output"

      - name: Collect and run installed-product regressions
        env:
          MDCOREALIGN_WHEEL_UNDER_TEST: ${{ env.CI_WHEEL }}
          MDCOREALIGN_SDIST_UNDER_TEST: ${{ env.CI_SDIST }}
        run: |
          python tools/ci/run_tests.py --test-layer product --artifact-kind candidate \
            --artifact-source-commit "$GITHUB_SHA" \
            --wheel "$CI_WHEEL" --expected-wheel-sha256 "$(sha256sum "$CI_WHEEL" | cut -d ' ' -f 1)" \
            --sdist "$CI_SDIST" --expected-sdist-sha256 "$(sha256sum "$CI_SDIST" | cut -d ' ' -f 1)" \
            --expected-version "$CI_EXPECTED_VERSION" --output-dir "$CI_REPORT_DIR/product"

      - name: Install explicit research-test dependencies
        run: python -m pip install -r requirements-ci-research.txt

      - name: Collect and run full-source research regressions
        run: python tools/ci/run_tests.py --test-layer research --artifact-kind source --output-dir "$CI_REPORT_DIR/research"

      - name: Collect archive QA separately without historical fixtures
        run: python tools/ci/run_tests.py --test-layer archive --artifact-kind source --output-dir "$CI_REPORT_DIR/archive"

      - name: Public API and release-quality checks
        run: |
          python -m ruff check src/mdcorealign tests/public_stable_polish_v6
          python -m mypy src/mdcorealign/__init__.py src/mdcorealign/output_schema.py

      - name: Retain layer selection, identity, counts and JUnit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-evidence-py${{ matrix.python-version }}
          path: ${{ env.CI_REPORT_DIR }}
          if-no-files-found: warn
